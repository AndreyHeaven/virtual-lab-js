<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Skeleton</title>
  <style>
    :root {
      --bg: #eef3fb;
      --card: #ffffff;
      --line: #d4deec;
      --text: #1c2734;
      --muted: #617084;
      --primary: #2b6ee7;
      --primary-soft: #eaf2ff;
      --danger: #c73939;
      --success: #13864b;
      --shadow: 0 10px 28px rgba(21, 36, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #dfeeff 0%, transparent 40%), var(--bg);
      padding: 16px;
    }

    .app-shell {
      max-width: 1160px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .app-header {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .stage-badge {
      background: var(--primary-soft);
      border: 1px solid #c4d8ff;
      color: #164ca7;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .app-title { margin: 0; font-size: 1.35rem; }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary-soft); border-color: #b9cefa; color: #164ca7; }
    .btn-danger { background: #fff0f0; border-color: #f3c6c6; color: #a11f1f; }
    .btn-success { background: #ebfff2; border-color: #bfeccc; color: #146a3f; }

    .is-hidden { display: none !important; }

    .game-layout {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr 320px;
    }

    .hint-text {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-text {
      margin: 8px 0 0;
      color: var(--muted);
      min-height: 22px;
      font-size: 0.92rem;
    }

    .config-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      margin-top: 10px;
    }

    .config-table th,
    .config-table td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
    }

    .config-table th {
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"] {
      width: 100px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
    }

    .prep-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .prep-start-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .game-board {
      position: relative;
      min-height: 380px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .item-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }

    .item-card.is-selected { outline: 2px solid var(--primary); }

    .item-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.87rem;
      margin-bottom: 8px;
    }

    .item-meter {
      border: 1px solid var(--line);
      border-radius: 10px;
      height: 140px;
      background: #f1f6fd;
      overflow: hidden;
      position: relative;
    }

    .item-meter-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, #86d7ff, #3f87f0);
      transition: height .2s ease;
    }

    .result-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(13, 37, 19, 0.55);
      border-radius: 14px;
      color: #fff;
      font-size: clamp(2rem, 9vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .log-list {
      margin-top: 10px;
      max-height: 64vh;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .log-row {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      font-size: 0.88rem;
      background: #fbfdff;
    }

    @media (max-width: 980px) {
      .game-layout { grid-template-columns: 1fr; }
      .log-list { max-height: 260px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="panel app-header">
      <h1 class="app-title">Название игры</h1>
      <div class="header-actions">
        <span class="stage-badge">Этап: <span id="stageText">Подготовка</span></span>
        <button id="backToPrepBtn" type="button">← Назад</button>
      </div>
    </header>

    <section id="preparationScreen" class="panel">
      <h2>Подготовка</h2>
      <table class="config-table">
        <thead>
          <tr>
            <th>Параметр 1</th>
            <th>Параметр 2</th>
            <th>Цель</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="preparationTableBody"></tbody>
      </table>
      <div class="prep-actions">
        <button id="addPreparationRowBtn" class="btn-primary">Добавить строку</button>
        <p class="hint-text">Подсказка для подготовки.</p>
      </div>
      <div class="prep-start-wrap">
        <button id="startGameBtn" class="btn-success">Игра</button>
      </div>
      <p id="preparationStatusText" class="status-text"></p>
    </section>

    <section id="gameAndLogScreen" class="game-layout is-hidden">
      <section class="panel game-board">
        <h2>Игра</h2>
        <p class="hint-text">Подсказка по действию в игре.</p>
        <p id="gameStatusText" class="status-text"></p>
        <div id="gameItemsGrid" class="items-grid"></div>
        <div id="resultOverlay" class="result-overlay is-hidden">Победа</div>
      </section>

      <aside class="panel">
        <div class="log-header">
          <h2 style="margin:0">Лог</h2>
          <button id="copyLogBtn" class="btn-success is-hidden">Скопировать лог</button>
        </div>
        <div id="logList" class="log-list"></div>
      </aside>
    </section>
  </div>

  <script>
    // 1) Конфигурация по умолчанию.
    const DEFAULT_CONFIG = [
      { valueA: 8, valueB: 0, target: null },
      { valueA: 5, valueB: 0, target: 4 },
      { valueA: 3, valueB: 0, target: null }
    ];

    // 2) Единое состояние игры.
    const state = {
      stage: 'Подготовка',
      configRows: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
      gameItems: [],
      selectedIndex: null,
      step: 0,
      won: false,
      log: []
    };

    // 3) Кэш DOM-элементов.
    const dom = {
      stageText: document.getElementById('stageText'),
      startGameBtn: document.getElementById('startGameBtn'),
      backToPrepBtn: document.getElementById('backToPrepBtn'),
      preparationScreen: document.getElementById('preparationScreen'),
      preparationTableBody: document.getElementById('preparationTableBody'),
      preparationStatusText: document.getElementById('preparationStatusText'),
      addPreparationRowBtn: document.getElementById('addPreparationRowBtn'),
      gameAndLogScreen: document.getElementById('gameAndLogScreen'),
      gameStatusText: document.getElementById('gameStatusText'),
      gameItemsGrid: document.getElementById('gameItemsGrid'),
      resultOverlay: document.getElementById('resultOverlay'),
      copyLogBtn: document.getElementById('copyLogBtn'),
      logList: document.getElementById('logList')
    };

    // 4) Базовые helper-методы.
    function setPreparationStatus(text) {
      dom.preparationStatusText.textContent = text;
    }

    function setGameStatus(text) {
      dom.gameStatusText.textContent = text;
    }

    function addLog(message) {
      state.log.push(message);
      renderLog();
    }

    // 5) Рендер-функции.
    function renderPreparationTable() {
      // TODO: отрисовать строки таблицы подготовки и привязать input/delete-обработчики.
    }

    function renderGameItems() {
      // TODO: отрисовать игровое поле, карточки/фишки, состояние выбора.
    }

    function renderLog() {
      dom.logList.innerHTML = '';
      state.log.forEach((line) => {
        const row = document.createElement('div');
        row.className = 'log-row';
        row.textContent = line;
        dom.logList.appendChild(row);
      });
      dom.logList.scrollTop = dom.logList.scrollHeight;
    }

    // 6) Бизнес-логика подготовки.
    function validatePreparation() {
      // TODO: проверить корректность данных, вернуть { ok: boolean, message: string }.
      return { ok: true, message: '' };
    }

    function buildPreparationSummary() {
      // TODO: вернуть строку для лога с итоговыми настройками.
      return 'TODO: summary';
    }

    // 7) Бизнес-логика игры.
    function handleGameItemClick(index) {
      // TODO: игровое действие по клику.
    }

    function checkWinCondition() {
      // TODO: проверить победу и при успехе:
      // state.won = true; state.stage = 'Результаты'; показать overlay; показать copy button.
    }

    // 8) Смена экранов.
    function switchToGameScreen() {
      const check = validatePreparation();
      if (!check.ok) {
        setPreparationStatus(check.message);
        return;
      }

      // TODO: построить state.gameItems из state.configRows.
      state.stage = 'Игра';
      state.step = 0;
      state.won = false;
      state.log = [];

      dom.stageText.textContent = state.stage;
      dom.preparationScreen.classList.add('is-hidden');
      dom.gameAndLogScreen.classList.remove('is-hidden');
      dom.resultOverlay.classList.add('is-hidden');
      dom.copyLogBtn.classList.add('is-hidden');

      addLog(`Подготовка для игры: ${buildPreparationSummary()}.`);
      addLog('Игра началась.');
      setGameStatus('');
      renderGameItems();
    }

    function switchToPreparationScreen() {
      state.stage = 'Подготовка';
      state.selectedIndex = null;
      dom.stageText.textContent = state.stage;
      dom.preparationScreen.classList.remove('is-hidden');
      dom.gameAndLogScreen.classList.add('is-hidden');
      setGameStatus('');
      renderPreparationTable();
    }

    // 9) Сброс.
    function resetAll() {
      state.stage = 'Подготовка';
      state.configRows = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      state.gameItems = [];
      state.selectedIndex = null;
      state.step = 0;
      state.won = false;
      state.log = [];

      dom.stageText.textContent = state.stage;
      dom.preparationScreen.classList.remove('is-hidden');
      dom.gameAndLogScreen.classList.add('is-hidden');
      dom.resultOverlay.classList.add('is-hidden');
      dom.copyLogBtn.classList.add('is-hidden');

      setPreparationStatus('');
      setGameStatus('');
      renderPreparationTable();
      renderLog();
      dom.gameItemsGrid.innerHTML = '';
    }

    // 10) Копирование лога.
    async function copyLogToClipboard() {
      const text = state.log.join('\n');
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const temp = document.createElement('textarea');
          temp.value = text;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          temp.remove();
        }
        setGameStatus('Лог скопирован в буфер обмена.');
      } catch (_err) {
        setGameStatus('Не удалось скопировать лог.');
      }
    }

    // 11) Привязка событий.
    function handleHeaderBack() {
      if (state.stage === 'Подготовка') {
        window.location.href = './index.html';
        return;
      }
      switchToPreparationScreen();
    }

    dom.startGameBtn.addEventListener('click', switchToGameScreen);
    dom.backToPrepBtn.addEventListener('click', handleHeaderBack);
    dom.copyLogBtn.addEventListener('click', copyLogToClipboard);
    dom.addPreparationRowBtn.addEventListener('click', () => {
      state.configRows.push({ valueA: 5, valueB: 0, target: null });
      setPreparationStatus('Добавлена строка.');
      renderPreparationTable();
    });

    // 12) Инициализация.
    resetAll();
  </script>
</body>
</html>
