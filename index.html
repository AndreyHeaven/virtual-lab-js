<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Виртуальная лаборатория</title>
  <style>
    :root {
      --bg: #eef3fb;
      --card: #ffffff;
      --line: #d4deec;
      --text: #1c2734;
      --muted: #617084;
      --primary: #2b6ee7;
      --primary-soft: #eaf2ff;
      --shadow: 0 10px 28px rgba(21, 36, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #dfeeff 0%, transparent 40%), var(--bg);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .menu {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .game-links {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .game-link {
      text-decoration: none;
      color: #164ca7;
      background: var(--primary-soft);
      border: 1px solid #b9cefa;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .game-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(43, 110, 231, 0.18);
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1 class="title">Меню выбора игр</h1>
    <p class="subtitle">Выберите режим виртуальной лаборатории:</p>

    <nav class="game-links" aria-label="Список игр">
      <a class="game-link" href="./Переливания.html">Игра «Переливания»</a>
      <a class="game-link" href="./Перекладывания.html">Игра «Перекладывания» (Ханой)</a>
    </nav>
  </main>
</body>
</html>
